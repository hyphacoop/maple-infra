[project]
name = "maple-infra"
version = "0.1.0"
description = "AWS Infrastructure for Maple"
authors = [{ name = "Alex Ball", email = "me@alexjball.com" }]
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.266.0,<3",
    "constructs>=10.5.0,<11",
]

[dependency-groups]
dev = [
    "black>=25.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maple"]
